name: Build Windows learning app

on:
  workflow_dispatch:
  push:
    branches: [codex/local-learning-app]
    paths:
      - 'learning_app/**'
      - '.github/workflows/build-learning-app.yml'

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r learning_app/requirements.txt
      - name: Run extraction and log tests
        run: python -m unittest discover -s learning_app/tests -v
      - name: Package portable application
        run: pyinstaller --noconfirm --clean --windowed --name AppLu-Apprendimento --collect-all fitz --collect-all pymupdf --collect-all docx --distpath learning_app/dist --workpath learning_app/build run_app.py
      - name: Include user guide
        run: Copy-Item learning_app/LEGGIMI_PRIMA.txt learning_app/dist/AppLu-Apprendimento/LEGGIMI_PRIMA.txt
        shell: pwsh
      - name: Archive
        run: Compress-Archive -Path learning_app/dist/AppLu-Apprendimento/* -DestinationPath AppLu-Apprendimento-portable.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: AppLu-Apprendimento-Windows-portable
          path: AppLu-Apprendimento-portable.zip
          if-no-files-found: error
      - name: Publish direct public download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "applu-learning-latest"
          $asset = "AppLu-Apprendimento-portable.zip"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset --prerelease --target $env:GITHUB_SHA --title "AppLu Apprendimento · Windows portable" --notes "Versione preliminare portable per il percorso guidato di apprendimento documentale. Estrarre completamente lo ZIP e avviare AppLu-Apprendimento.exe."
          }

